name: Build ASD

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write


jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Pin .NET 8
      shell: pwsh
      run: |-
        Set-Content -Path 'global.json' -Value '{"sdk":{"version":"8.0.400","rollForward":"latestFeature"}}'
        dotnet --version

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Restore
      run: dotnet restore ASD.sln

    - name: Build with MSBuild
      id: build
      shell: pwsh
      run: |-
        msbuild ASD.csproj /p:Configuration=Release /p:Platform=x64 /v:detailed 2>&1 | Tee-Object -FilePath build-log.txt
        Write-Host "BUILD EXIT CODE: $LASTEXITCODE"
      continue-on-error: true

    - name: Extract errors
      if: steps.build.outcome == 'failure'
      shell: pwsh
      run: |-
        Write-Host '=== ERRORS ==='
        Select-String -Path build-log.txt -Pattern 'error ' | Select-Object -First 50 | ForEach-Object { Write-Host $_.Line }

    - name: Publish self-contained (folder, not single-file)
      id: publish
      if: steps.build.outcome == 'success'
      shell: pwsh
      run: |-
        # the contract library for the extensions is built on its own first; ASD then references the finished DLL
        # (a project reference makes the publish step look for an ASD.Extensibility.pri that does not exist)
        dotnet build ASD.Extensibility/ASD.Extensibility.csproj -c Release -p:Platform=x64 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\publish-log.txt"
        $contract = (Get-ChildItem -Path 'ASD.Extensibility/bin' -Recurse -Filter 'ASD.Extensibility.dll' | Select-Object -First 1).FullName
        Write-Host "CONTRACT DLL: $contract"

        dotnet publish ASD.csproj -c Release -r win-x64 `
          --self-contained true `
          -p:PublishSingleFile=false `
          -p:PublishTrimmed=false `
          "-p:AsdExtensibilityDll=$contract" `
          -p:Platform=x64 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\publish-log.txt" -Append
        $code = $LASTEXITCODE
        Write-Host "PUBLISH EXIT CODE: $code"
        if ($code -eq 0) {
          echo "publish_ok=true" >> $env:GITHUB_OUTPUT
        } else {
          echo "publish_ok=false" >> $env:GITHUB_OUTPUT
        }
      continue-on-error: true

    - name: Show publish errors
      if: steps.publish.outputs.publish_ok != 'true'
      shell: pwsh
      run: |-
        Write-Host "=== PUBLISH ERRORS ==="
        if (Test-Path "$env:RUNNER_TEMP\publish-log.txt") {
          Select-String -Path "$env:RUNNER_TEMP\publish-log.txt" -Pattern 'error ' | Select-Object -First 20 | ForEach-Object { Write-Host $_.Line }
        }

    - name: Find published EXE
      id: findexe
      if: steps.publish.outputs.publish_ok == 'true'
      shell: pwsh
      run: |-
        $exe = Get-ChildItem -Path '.' -Recurse -Filter 'ASD.exe' -ErrorAction SilentlyContinue |
          Where-Object { $_.FullName -like '*bin*Release*publish*' } |
          Select-Object -First 1
        if ($exe) {
          echo "exe_found=true" >> $env:GITHUB_OUTPUT
          echo "exe_dir=$($exe.DirectoryName)" >> $env:GITHUB_OUTPUT
          echo "exe_path=$($exe.FullName)" >> $env:GITHUB_OUTPUT
          $size = [math]::Round(($exe.Length / 1MB), 2)
          Write-Host "PUBLISHED EXE: $($exe.FullName) ($size MB)"
        } else {
          echo "exe_found=false" >> $env:GITHUB_OUTPUT
          Write-Host "Published EXE not found"
        }

    - name: Find fallback EXE (non-publish build)
      id: findexe2
      if: steps.findexe.outputs.exe_found != 'true' && steps.build.outcome == 'success'
      shell: pwsh
      run: |-
        $exe = Get-ChildItem -Path '.' -Recurse -Filter 'ASD.exe' -ErrorAction SilentlyContinue |
          Where-Object { $_.FullName -like '*bin*Release*' } |
          Select-Object -First 1
        if ($exe) {
          echo "exe_found=true" >> $env:GITHUB_OUTPUT
          echo "exe_dir=$($exe.DirectoryName)" >> $env:GITHUB_OUTPUT
          echo "exe_path=$($exe.FullName)" >> $env:GITHUB_OUTPUT
          Write-Host "FALLBACK EXE: $($exe.FullName)"
        } else {
          echo "exe_found=false" >> $env:GITHUB_OUTPUT
        }

    - name: Create ZIP (ASD.zip) and update.txt (inside the zip AND as a separate release file)
      id: zip
      if: steps.findexe.outputs.exe_found == 'true' || steps.findexe2.outputs.exe_found == 'true'
      shell: pwsh
      run: |-
        $dir = "${{ steps.findexe.outputs.exe_dir }}"
        if (-not $dir) { $dir = "${{ steps.findexe2.outputs.exe_dir }}" }
        Write-Host "ZIP SOURCE: $dir"
        $zip = Join-Path $env:RUNNER_TEMP 'ASD.zip'
        if (Test-Path $zip) { Remove-Item $zip -Force }
        Compress-Archive -Path (Join-Path $dir '*') -DestinationPath $zip -CompressionLevel Optimal
        $size = [math]::Round(((Get-Item $zip).Length / 1MB), 2)

        # update.txt = commit name (message) + details. It goes INTO ASD.zip (so a manual download knows its version)
        # and is also published next to ASD.zip in the release (so the app can check for updates without downloading the zip).
        $subject = (git log -1 --pretty=%s).Trim()
        $body    = (git log -1 --pretty=%b).Trim()
        $sha     = (git rev-parse --short HEAD).Trim()
        $date    = (Get-Date).ToUniversalTime().ToString("yyyy-MM-dd HH:mm 'UTC'")
        $lines = @("Commit: $subject")
        if ($body) { $lines += ""; $lines += $body }
        $lines += ""; $lines += "SHA: $sha"; $lines += "Date: $date"; $lines += "Size: $size MB"
        $updatePath = Join-Path $env:RUNNER_TEMP 'update.txt'
        Set-Content -Path $updatePath -Value $lines -Encoding utf8
        Get-Content $updatePath
        Compress-Archive -Path $updatePath -DestinationPath $zip -Update   # adds update.txt at the root of the zip

        # Sanity check: ASD.exe and update.txt must both be at the root of the zip
        Add-Type -AssemblyName System.IO.Compression
        Add-Type -AssemblyName System.IO.Compression.FileSystem
        $check = [System.IO.Compression.ZipFile]::OpenRead($zip)
        try {
          if (-not ($check.Entries | Where-Object { $_.FullName -eq 'ASD.exe' })) { throw 'ASD.exe is missing from the root of ASD.zip' }
          if (-not ($check.Entries | Where-Object { $_.FullName -eq 'update.txt' })) { throw 'update.txt is missing from the root of ASD.zip' }
        } finally { $check.Dispose() }

        Write-Host "CREATED: ASD.zip ($size MB, with update.txt inside) + separate update.txt"
        echo "zip_path=$zip" >> $env:GITHUB_OUTPUT
        echo "zip_size=$size" >> $env:GITHUB_OUTPUT
        echo "update_path=$updatePath" >> $env:GITHUB_OUTPUT

    - name: Upload ASD.zip as an artifact
      if: steps.zip.outcome == 'success'
      uses: actions/upload-artifact@v4
      with:
        name: ASD-Release-Files
        path: |
          ${{ steps.zip.outputs.zip_path }}

    - name: Update single release (tag "latest") with ASD.zip and update.txt
      if: steps.zip.outcome == 'success'
      shell: pwsh
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |-
        $tag = "latest"
        $zipPath = "${{ steps.zip.outputs.zip_path }}"
        $updatePath = "${{ steps.zip.outputs.update_path }}"
        $subject = (git log -1 --pretty=%s).Trim()

        # Keep ONE release/tag: delete the old one, then recreate it
        gh release delete $tag --cleanup-tag --yes 2>$null
        $global:LASTEXITCODE = 0

        # the zip and update.txt go into the release, next to (not inside) the zip
        $assets = @($zipPath, $updatePath)
        gh release create $tag @assets `
          --target $env:GITHUB_SHA `
          --title "ASD - $subject" `
          --notes-file $updatePath

    - name: Upload logs on failure
      if: steps.build.outcome == 'failure' || steps.publish.outputs.publish_ok != 'true'
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: |
          build-log.txt
          ${{ runner.temp }}/publish-log.txt

  # ───────────────────────────────────────────────────────────────────────────────────────────────
  # The installed ASD: ASD.msix (signed) + ASD-Setup.exe (WinUI 3 installer, one file) + msix.txt.
  # Runs after "build" (which creates the release "latest") and adds its files to that release.
  # Needs two repository secrets: MSIX_PFX_BASE64 and MSIX_PFX_PASSWORD (the signing certificate).
  # Without them this job does nothing, and everything above works as before.
  # ───────────────────────────────────────────────────────────────────────────────────────────────
  msix:
    name: MSIX package and Setup
    needs: build
    if: ${{ always() && needs.build.result == 'success' }}
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MSIX_PFX_BASE64: ${{ secrets.MSIX_PFX_BASE64 }}
      MSIX_PFX_PASSWORD: ${{ secrets.MSIX_PFX_PASSWORD }}
    steps:
    - uses: actions/checkout@v4

    - name: Read the signing certificate
      id: cert
      shell: pwsh
      run: |-
        if (-not $env:MSIX_PFX_BASE64 -or -not $env:MSIX_PFX_PASSWORD) {
          Write-Host 'MSIX_PFX_BASE64 / MSIX_PFX_PASSWORD are not set: skipping the MSIX package and the installer.'
          'have_cert=false' | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          exit 0
        }
        $pfx = Join-Path $env:RUNNER_TEMP 'asd.pfx'
        [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:MSIX_PFX_BASE64.Trim()))
        $cert = [Security.Cryptography.X509Certificates.X509Certificate2]::new($pfx, $env:MSIX_PFX_PASSWORD)
        Write-Host "Certificate subject: $($cert.Subject)   valid until: $($cert.NotAfter)"
        $eku = ($cert.Extensions | Where-Object { $_ -is [Security.Cryptography.X509Certificates.X509EnhancedKeyUsageExtension] } | ForEach-Object { $_.EnhancedKeyUsages | ForEach-Object { "$($_.FriendlyName) ($($_.Value))" } }) -join ', '
        Write-Host "Has private key: $($cert.HasPrivateKey)   Enhanced key usage: $eku"
        if (-not $cert.HasPrivateKey) { throw 'The PFX has no private key.' }
        if ($eku -notmatch '1\.3\.6\.1\.5\.5\.7\.3\.3') { throw 'The certificate is not a Code Signing certificate (missing key usage 1.3.6.1.5.5.7.3.3).' }
        [IO.File]::WriteAllBytes((Join-Path $env:RUNNER_TEMP 'ASD.cer'), $cert.Export([Security.Cryptography.X509Certificates.X509ContentType]::Cert))
        'have_cert=true'   | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
        "pfx=$pfx"         | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
        "subject=$($cert.Subject)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

    - name: Pin .NET 8
      if: steps.cert.outputs.have_cert == 'true'
      shell: pwsh
      run: |-
        Set-Content -Path 'global.json' -Value '{"sdk":{"version":"8.0.400","rollForward":"latestFeature"}}'
        dotnet --version

    - name: Setup MSBuild
      if: steps.cert.outputs.have_cert == 'true'
      uses: microsoft/setup-msbuild@v2

    - name: Fill in the package identity (publisher = certificate subject, version = 1.0.run.0)
      if: steps.cert.outputs.have_cert == 'true'
      id: manifest
      shell: pwsh
      env:
        SUBJECT: ${{ steps.cert.outputs.subject }}
      run: |-
        $version = "1.0.$($env:GITHUB_RUN_NUMBER).0"
        $text = [IO.File]::ReadAllText('Package.appxmanifest')
        $text = [regex]::Replace($text, '(<Identity\s[^>]*?)Publisher="[^"]*"', { param($m) $m.Groups[1].Value + 'Publisher="' + $env:SUBJECT + '"' })
        $text = [regex]::Replace($text, '(<Identity\s[^>]*?)Version="[^"]*"',   { param($m) $m.Groups[1].Value + 'Version="' + $version + '"' })
        [IO.File]::WriteAllText('Package.appxmanifest', $text, [Text.UTF8Encoding]::new($false))
        Select-String -Path 'Package.appxmanifest' -Pattern '<Identity' | ForEach-Object { Write-Host $_.Line }
        "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

    - name: Build and sign ASD.msix
      if: steps.cert.outputs.have_cert == 'true'
      id: msix
      shell: pwsh
      env:
        PFX: ${{ steps.cert.outputs.pfx }}
      run: |-
        $out = "$($env:RUNNER_TEMP -replace '\\','/')/msix-out/"
        # AsdMsix=true switches ASD.csproj to MSIX mode (see ASD.csproj); it must not be spelled out here as
        # WindowsPackageType / GenerateAppx...: msbuild would pass those to ASD.Extensibility (a library) too.
        # the contract DLL for the extensions is built first, on its own (ASD references the finished DLL in MSIX mode)
        msbuild ASD.Extensibility/ASD.Extensibility.csproj /restore /p:Configuration=Release /p:Platform=x64 /v:minimal 2>&1 | Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'msix-build.txt')
        $contract = (Get-ChildItem -Path 'ASD.Extensibility/bin' -Recurse -Filter 'ASD.Extensibility.dll' | Select-Object -First 1).FullName
        Write-Host "CONTRACT DLL: $contract"

        msbuild ASD.csproj /restore /p:Configuration=Release /p:Platform=x64 /p:RuntimeIdentifier=win-x64 `
          /p:AsdMsix=true "/p:AsdExtensibilityDll=$contract" `
          "/p:AppxPackageDir=$out" /v:minimal 2>&1 | Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'msix-build.txt') -Append
        Write-Host "MSBUILD EXIT CODE: $LASTEXITCODE"

        $msix = Get-ChildItem -Path $out -Recurse -Filter '*.msix' -ErrorAction SilentlyContinue | Select-Object -First 1
        if (-not $msix) {
          Write-Host '=== ERRORS ==='
          Select-String -Path (Join-Path $env:RUNNER_TEMP 'msix-build.txt') -Pattern 'error ' | Select-Object -First 30 | ForEach-Object { Write-Host $_.Line }
          throw 'ASD.msix was not produced.'
        }
        $stage = Join-Path $env:RUNNER_TEMP 'release-files'
        New-Item -ItemType Directory -Force -Path $stage | Out-Null
        $log = Join-Path $env:RUNNER_TEMP 'msix-build.txt'

        $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
          Where-Object { $_.FullName -like '*\x64\signtool.exe' } | Sort-Object FullName -Descending | Select-Object -First 1
        if (-not $signtool) { throw 'signtool.exe was not found on this runner.' }
        $makeappx = Join-Path (Split-Path $signtool.FullName) 'makeappx.exe'
        Write-Host "SIGNTOOL: $($signtool.FullName)"
        # the password goes in as one argument, so special characters in it are safe
        function Sign([string]$file) {
          & $signtool.FullName sign /fd SHA256 /f $env:PFX /p $env:MSIX_PFX_PASSWORD $file 2>&1 | Tee-Object -FilePath $log -Append
          if ($LASTEXITCODE -ne 0) { throw "signtool failed on $file (exit code $LASTEXITCODE): see the log above." }
        }

        # 1) sign the programs INSIDE the package (ASD.exe, ASD.dll, ASD.Extensibility.dll), so that their file
        #    properties show the publisher: unpack, sign, pack again. If packing again fails the unsigned-inside package is used.
        $package = $msix.FullName
        $unpacked = Join-Path $env:RUNNER_TEMP 'msix-unpacked'
        $repacked = Join-Path $env:RUNNER_TEMP 'ASD-repacked.msix'
        Remove-Item $unpacked, $repacked -Recurse -Force -ErrorAction SilentlyContinue
        try {
          & $makeappx unpack /p $msix.FullName /d $unpacked /o 2>&1 | Tee-Object -FilePath $log -Append
          if ($LASTEXITCODE -ne 0) { throw "makeappx unpack failed (exit code $LASTEXITCODE)" }
          foreach ($name in 'ASD.exe', 'ASD.dll', 'ASD.Extensibility.dll') {
            $f = Join-Path $unpacked $name
            if (Test-Path $f) { Sign $f; Write-Host "signed inside the package: $name" } else { Write-Host "not in the package (skipped): $name" }
          }
          # MakeAppx writes these three itself
          foreach ($reserved in 'AppxBlockMap.xml', '[Content_Types].xml', 'AppxSignature.p7x') {
            Remove-Item -LiteralPath (Join-Path $unpacked $reserved) -Force -ErrorAction SilentlyContinue
          }
          & $makeappx pack /d $unpacked /p $repacked /o 2>&1 | Tee-Object -FilePath $log -Append
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $repacked)) { throw "makeappx pack failed (exit code $LASTEXITCODE)" }
          $package = $repacked
          Write-Host 'the package was packed again with the signed programs inside.'
        } catch {
          Write-Host "WARNING: the programs inside the package stay unsigned: $($_.Exception.Message)"
        }

        # 2) sign the package itself
        Copy-Item $package (Join-Path $stage 'ASD.msix') -Force
        Sign (Join-Path $stage 'ASD.msix')
        Write-Host 'ASD.msix is signed.'
        Copy-Item (Join-Path $env:RUNNER_TEMP 'ASD.cer') (Join-Path $stage 'ASD.cer') -Force
        $size = [math]::Round(((Get-Item (Join-Path $stage 'ASD.msix')).Length / 1MB), 1)
        Write-Host "ASD.msix: $size MB  ($($msix.FullName))"

        # msix.txt: the installed ASD reads this (version + hash) to learn whether an update exists
        $hash = (Get-FileHash (Join-Path $stage 'ASD.msix') -Algorithm SHA256).Hash.ToLowerInvariant()
        $subject = (git log -1 --pretty=%s).Trim()
        $body    = (git log -1 --pretty=%b).Trim()
        $sha     = (git rev-parse --short HEAD).Trim()
        $date    = (Get-Date).ToUniversalTime().ToString("yyyy-MM-dd HH:mm 'UTC'")
        $lines = @("Version: ${{ steps.manifest.outputs.version }}", "SHA256: $hash", "", "Commit: $subject")
        if ($body) { $lines += ""; $lines += $body }
        $lines += ""; $lines += "SHA: $sha"; $lines += "Date: $date"; $lines += "Size: $size MB"
        Set-Content -Path (Join-Path $stage 'msix.txt') -Value $lines -Encoding utf8
        Get-Content (Join-Path $stage 'msix.txt')

    - name: Build ASD-Setup.exe (WinUI 3, self-contained, one file)
      if: steps.cert.outputs.have_cert == 'true'
      id: setup
      shell: pwsh
      continue-on-error: true
      env:
        PFX: ${{ steps.cert.outputs.pfx }}
      run: |-
        # the installer carries the PUBLIC certificate inside, so it trusts only our own package
        Copy-Item (Join-Path $env:RUNNER_TEMP 'ASD.cer') 'ASD.Setup/ASD.cer' -Force
        dotnet publish ASD.Setup/ASD.Setup.csproj -c Release -r win-x64 -p:Platform=x64 2>&1 | Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'setup-build.txt')
        Write-Host "PUBLISH EXIT CODE: $LASTEXITCODE"
        $exe = Get-ChildItem -Path 'ASD.Setup' -Recurse -Filter 'ASD-Setup.exe' -ErrorAction SilentlyContinue |
          Where-Object { $_.FullName -like '*publish*' } | Select-Object -First 1
        if (-not $exe) {
          Write-Host '=== ERRORS ==='
          Select-String -Path (Join-Path $env:RUNNER_TEMP 'setup-build.txt') -Pattern 'error ' | Select-Object -First 30 | ForEach-Object { Write-Host $_.Line }
          throw 'ASD-Setup.exe was not produced.'
        }
        Copy-Item $exe.FullName (Join-Path $env:RUNNER_TEMP 'release-files/ASD-Setup.exe') -Force

        # sign the installer too (file properties -> Digital Signatures -> Adva ASD)
        $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
          Where-Object { $_.FullName -like '*\x64\signtool.exe' } | Sort-Object FullName -Descending | Select-Object -First 1
        if (-not $signtool) { throw 'signtool.exe was not found on this runner.' }
        $final = Join-Path $env:RUNNER_TEMP 'release-files/ASD-Setup.exe'
        & $signtool.FullName sign /fd SHA256 /f $env:PFX /p $env:MSIX_PFX_PASSWORD $final 2>&1 | Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'setup-build.txt') -Append
        if ($LASTEXITCODE -ne 0) { throw "signtool failed on ASD-Setup.exe (exit code $LASTEXITCODE)" }
        Write-Host "ASD-Setup.exe: $([math]::Round((Get-Item $final).Length / 1MB, 1)) MB, signed"

    - name: Add the files to the release "latest"
      if: steps.cert.outputs.have_cert == 'true' && steps.msix.outcome == 'success'
      shell: pwsh
      run: |-
        gh release view latest *> $null
        if ($LASTEXITCODE -ne 0) { throw 'The release "latest" does not exist yet (the build job creates it).' }
        $stage = Join-Path $env:RUNNER_TEMP 'release-files'
        $files = Get-ChildItem $stage -File | ForEach-Object { $_.FullName }
        $files | ForEach-Object { Write-Host "UPLOAD: $_" }
        gh release upload latest @files --clobber

    - name: Upload the logs
      if: always() && steps.cert.outputs.have_cert == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: msix-logs
        path: |
          ${{ runner.temp }}/msix-build.txt
          ${{ runner.temp }}/setup-build.txt
