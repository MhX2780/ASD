name: Remote Desktop (Cloudflare Quick Tunnel)

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: 'Keep the machine for at most this many minutes (5 - 330)'
        default: '60'
      idle_minutes:
        description: 'Stop by itself after nobody was connected for this many minutes'
        default: '10'

permissions:
  contents: read

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 350
    steps:
    - name: Check the secrets
      shell: pwsh
      env:
        RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
      run: |-
        if (-not $env:RDP_PASSWORD -or $env:RDP_PASSWORD.Length -lt 12) { throw 'The secret RDP_PASSWORD is missing or shorter than 12 characters.' }
        Write-Host 'Secrets found.'

    - name: Enable Remote Desktop (RDP)
      shell: pwsh
      env:
        RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
      run: |-
        $ErrorActionPreference = 'Stop'

        # تفعيل RDP وتعطيل NLA لتسهيل الاتصال
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
        
        # إعداد جدار الحماية
        Set-NetFirewallRule -DisplayGroup "Remote Desktop" -Profile Any -Enabled True

        # إعداد المستخدم وكلمة المرور
        $user = $env:USERNAME
        $securePassword = ConvertTo-SecureString $env:RDP_PASSWORD -AsPlainText -Force
        Set-LocalUser -Name $user -Password $securePassword -PasswordNeverExpires $true
        Add-LocalGroupMember -Group "Remote Desktop Users" -Member $user -ErrorAction SilentlyContinue

        # إعادة تشغيل الخدمة
        Set-Service -Name TermService -StartupType Automatic
        Restart-Service -Name TermService -Force

        Write-Host "Remote Desktop is ON. User: $user"
        "RDP_USER=$user" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

    - name: Install cloudflared and Start Quick Tunnel
      shell: pwsh
      run: |-
        # تحميل أداة cloudflared
        Invoke-WebRequest -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" -OutFile "cloudflared.exe"
        
        # تشغيل النفق في الخلفية (Quick Tunnel) وتوجيهه إلى منفذ RDP المحلي
        Write-Host "Starting Cloudflare Quick Tunnel to rdp://localhost:3389 ..."
        $proc = Start-Process -FilePath ".\cloudflared.exe" -ArgumentList "tunnel --url rdp://localhost:3389 --no-autoupdate" -NoNewWindow -RedirectStandardError "tunnel_log.txt" -PassThru
        
        # الانتظار حتى يظهر رابط trycloudflare.com
        $url = $null
        for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep -Seconds 2
            if (Test-Path "tunnel_log.txt") {
                $content = Get-Content "tunnel_log.txt" -Raw
                $match = [regex]::Match($content, 'https://[a-zA-Z0-9-]+\.trycloudflare\.com')
                if ($match.Success) {
                    $url = $match.Value
                    break
                }
            }
        }
        
        if ($url) {
            Write-Host "Tunnel URL: $url"
            "TUNNEL_URL=$url" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
        } else {
            Write-Error "Failed to get Cloudflare Tunnel URL. Check tunnel_log.txt for details."
            Get-Content "tunnel_log.txt" -ErrorAction SilentlyContinue
        }

    - name: Keep the machine alive
      shell: pwsh
      env:
        MINUTES: ${{ inputs.minutes }}
        IDLE_MINUTES: ${{ inputs.idle_minutes }}
        RDP_USER: ${{ env.RDP_USER }}
        TUNNEL_URL: ${{ env.TUNNEL_URL }}
      run: |-
        $minutes = [int]$env:MINUTES;      if ($minutes -lt 5)  { $minutes = 5 };  if ($minutes -gt 330) { $minutes = 330 }
        $idleMax = [int]$env:IDLE_MINUTES; if ($idleMax -lt 2)  { $idleMax = 2 };  if ($idleMax -gt 120) { $idleMax = 120 }

        $lines = @(
          '## Remote Desktop is ready (Cloudflare Quick Tunnel)',
          '',
          "- **Tunnel URL (Hostname):** $env:TUNNEL_URL",
          "- **User account:** $env:RDP_USER",
          "- **Password:** (the secret RDP_PASSWORD)",
          '',
          '### How to connect from your PC:',
          '1. Install cloudflared on your PC.',
          '2. Run: cloudflared access rdp --hostname <TUNNEL_URL> --url rdp://localhost:13389',
          '3. Open Remote Desktop and connect to: **localhost:13389**',
          '',
          "- Stops after $minutes minutes, or after $idleMax minutes with nobody connected."
        )
        $lines | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
        
        Write-Host "=========================================="
        Write-Host "READY  Tunnel URL: $env:TUNNEL_URL"
        Write-Host "User: $env:RDP_USER"
        Write-Host "=========================================="

        $end = (Get-Date).AddMinutes($minutes)
        $lastBusy = Get-Date
        $everConnected = $false
        while ((Get-Date) -lt $end) {
          $busy = @(Get-NetTCPConnection -LocalPort 3389 -State Established -ErrorAction SilentlyContinue).Count -gt 0
          if ($busy) { $lastBusy = Get-Date; $everConnected = $true }
          $limit = if ($everConnected) { $idleMax } else { [Math]::Max(15, $idleMax) }
          if (((Get-Date) - $lastBusy).TotalMinutes -ge $limit) { Write-Host "Nobody connected for $limit minutes: stopping."; break }
          Start-Sleep -Seconds 20
        }
        Write-Host 'Done. The machine will be removed.'
